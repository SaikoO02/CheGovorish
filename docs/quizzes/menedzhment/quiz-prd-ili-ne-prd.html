<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../../image/F225.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="../../" />
    <title>Квиз — PRD или не PRD?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;700&family=JetBrains+Mono:wght@300;400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="pages/quiz/quiz-run.css" />
    <script src="quizzes/menedzhment/quiz-prd-ili-ne-prd.js" defer></script>
    <script src="pages/quiz/quiz-engine.js" defer></script>
    <script src="footer/footer-loader.js" defer></script>
    <script src="footer/footer-animation.js" defer></script>
  </head>

  <body class="page-quiz-run" id="page-top">
    <header class="block main_page_background">
      <div class="container">
        <div class="header">
          <a class="logo" href="/" aria-label="Logo">Логотип</a>
          <nav class="menu" aria-label="Main menu">
            <a class="menu__item" href="pages/themes/">темы</a>
            <a class="menu__item" href="pages/glossary/">глоссарий</a>
            <a class="menu__item" href="pages/articles/">статьи</a>
            <a class="menu__item" href="pages/quiz/">квизы</a>
            <a class="menu__item" href="#">о медиа</a>
          </nav>
          <button class="menu-burger" aria-label="Открыть меню" aria-expanded="false"></button>
        </div>
      </div>
    </header>

    <main>
      <section class="quiz-run-intro" id="quiz-intro" aria-labelledby="quiz-intro-title">
        <div class="container quiz-run-intro__inner">
          <div class="quiz-run-intro__top">
            <p class="quiz-run-intro__kicker">КВИЗ</p>
            <a class="quiz-run-intro__back" href="pages/quiz/">&lt;&lt; Все квизы</a>
          </div>
          <h1 class="quiz-run-intro__title" id="quiz-intro-title">PRD ИЛИ НЕ PRD?</h1>
          <p class="quiz-run-intro__desc">
            10 вопросов о продуктовых требованиях. Проверьте, умеете ли вы отличить хороший PRD от плохого.
          </p>
          <button class="quiz-run-intro__play" type="button" id="quiz-start">ИГРАТЬ</button>
        </div>
      </section>

      <section class="quiz-game" id="quiz-game" aria-label="Квиз" hidden>
        <div class="container quiz-game__top">
          <a class="quiz-game__back" href="pages/quiz/">&lt;&lt; Все квизы</a>
          <div class="quiz-game__progress" id="quiz-progress">1/10</div>
        </div>

        <div class="container">
          <div class="quiz-game__image" aria-hidden="true"></div>
        </div>

        <div class="container quiz-game__center" id="quiz-card">
          <h2 class="quiz-game__question" id="quiz-q-text"></h2>
          <form class="quiz-game__answers" id="quiz-answers" aria-describedby="quiz-feedback"></form>
          <div class="quiz-game__feedback" id="quiz-feedback" aria-live="polite"></div>
        </div>

        <div class="quiz-run__result" id="quiz-result" hidden>
          <h2 class="quiz-run__result-title">Готово</h2>
          <p class="quiz-run__result-text" id="quiz-result-text"></p>
          <div class="quiz-run__result-actions">
            <button class="quiz-run__btn quiz-run__btn--primary" type="button" id="quiz-restart">Пройти ещё раз</button>
            <a class="quiz-run__btn quiz-run__btn--ghost" href="pages/quiz/">К списку</a>
          </div>
        </div>
      </section>

      <section class="quiz-finish" id="quiz-finish" aria-label="Финальный слайд" hidden>
        <div class="quiz-finish__content container">
          <div class="quiz-finish__left">
            <h2 class="quiz-finish__kicker">ВАШ РЕЗУЛЬТАТ:</h2>
            <div class="quiz-finish__score" id="quiz-finish-score"></div>
            <p class="quiz-finish__desc" id="quiz-finish-desc"></p>
            <div class="quiz-finish__actions">
              <button class="quiz-finish__btn quiz-finish__btn--ghost" type="button" id="quiz-finish-retry">
                &lt;&lt; Сыграть ещё
              </button>
              <a class="quiz-finish__btn" href="pages/quiz/">Другие квизы &gt;&gt;</a>
            </div>
          </div>

          <div class="quiz-finish__art" aria-hidden="true"></div>
        </div>
      </section>
    </main>
  </body>
</html>
